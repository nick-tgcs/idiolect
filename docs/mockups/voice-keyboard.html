<!doctype html>
<html><head><meta charset="utf-8"><title>idiolect voice keyboard — mockup</title><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* idiolect palette: accent #7c83fd (periwinkle), slate greys, light grey #e5e7eb */
  :root{
    --accent:#7c83fd; --accent-bright:#a6abff; --accent-dim:#5a60c8;
    --panel:#1b1e27; --strip:#272b36; --slate:#333845; --slate2:#454b5c;
    --grey:#c7cad3; --grey-dim:#8b8f9c;
  }
  body { background:#0d0e12; font-family:'Roboto','Segoe UI',sans-serif; padding:30px; color:var(--grey); }
  h1 { font-size:18px; font-weight:600; margin-bottom:4px; color:#e5e7eb; }
  .sub { color:var(--grey-dim); font-size:13px; margin-bottom:24px; }
  .row { display:flex; gap:22px; align-items:flex-start; }
  .col { width:300px; }
  .cap { font-size:14px; text-align:center; margin-bottom:10px; font-weight:500; color:var(--grey); }
  .cap small { display:block; color:var(--grey-dim); font-weight:400; font-size:12px; margin-top:2px; }
  .ime { background:var(--panel); border-radius:16px 16px 0 0; padding-bottom:18px; overflow:hidden;
         box-shadow:0 -2px 28px rgba(0,0,0,.55); border:1px solid #ffffff0a; }
  .progress { height:3px; background:var(--strip); }
  .progress > i { display:block; height:100%; width:42%; background:var(--accent); border-radius:2px; }
  .progress.idle > i { width:0; }
  .strip { display:flex; align-items:center; justify-content:space-around;
           background:var(--strip); border-radius:24px; height:46px; margin:12px 16px 0; }
  .strip .ib { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .strip .ib svg { width:23px; height:23px; fill:var(--grey); }
  .strip .divider { width:1px; height:20px; background:#ffffff1c; }
  .status { height:22px; line-height:22px; text-align:center; font-size:13px; margin-top:11px; font-weight:500; }
  .stage { display:flex; align-items:center; justify-content:center; padding:20px 0 8px; }
  .mic { width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mic svg { width:42px; height:42px; }
  .chips { display:flex; gap:8px; justify-content:center; padding:6px 16px 0; flex-wrap:wrap; min-height:8px; }
  .chip { background:var(--slate); color:#e5e7eb; border:1px solid #ffffff14; border-radius:16px; padding:6px 14px; font-size:13px; }
  .hint { color:#6d7280; font-size:11px; text-align:center; margin-top:16px; }
  /* mic states (purple / grey) */
  .idleC   { background:var(--slate); }
  .listenC { background:var(--accent); box-shadow:0 0 0 8px #7c83fd2e; }
  .speakC  { background:var(--accent-bright); box-shadow:0 0 0 13px #a6abff2b; }
  .procC   { background:var(--slate2); }
  .s-idle{color:var(--grey-dim);} .s-listen{color:var(--accent-bright);}
  .s-speak{color:#cdd0ff;} .s-proc{color:#aeb2cf;}
</style></head>
<body>
  <h1>idiolect — voice keyboard (press & hold)</h1>
  <div class="sub">Brand palette: periwinkle accent <b style="color:#7c83fd">#7c83fd</b> on slate grey. One circular mic that lights up by state.</div>
  <div class="row" id="r"></div>
  <script>
    // idiolect's own line-art mic glyph (64-grid), drawn in the given colour.
    const mic = (c) => `<svg viewBox="0 0 64 64"><g fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="8" width="20" height="30" rx="10" fill="${c}"/><path d="M14 34 C14 50 50 50 50 34"/><path d="M32 47 L32 54"/><path d="M23 55 L41 55"/></g></svg>`;
    const KEY = `<svg viewBox="0 0 24 24"><path d="M20,5L4,5c-1.1,0 -1.99,0.9 -1.99,2L2,17c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2L22,7c0,-1.1 -0.9,-2 -2,-2zM11,8h2v2h-2zM11,11h2v2h-2zM8,8h2v2H8zM8,11h2v2H8zM7,13H5v-2h2zM7,10H5V8h2zM16,17H8v-2h8zM16,13h-2v-2h2zM16,10h-2V8h2zM19,13h-2v-2h2zM19,10h-2V8h2z"/></svg>`;
    const GLOBE = `<svg viewBox="0 0 24 24"><path d="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM18.92,8h-2.95c-0.32,-1.25 -0.78,-2.45 -1.38,-3.56 1.84,0.63 3.37,1.91 4.33,3.56zM12,4.04c0.83,1.2 1.48,2.53 1.91,3.96h-3.82c0.43,-1.43 1.08,-2.76 1.91,-3.96zM4.26,14C4.1,13.36 4,12.69 4,12s0.1,-1.36 0.26,-2h3.38c-0.08,0.66 -0.14,1.32 -0.14,2 0,0.68 0.06,1.34 0.14,2zM5.08,16h2.95c0.32,1.25 0.78,2.45 1.38,3.56 -1.84,-0.63 -3.37,-1.9 -4.33,-3.56zM8.03,8H5.08c0.96,-1.66 2.49,-2.93 4.33,-3.56C8.81,5.55 8.35,6.75 8.03,8zM12,19.96c-0.83,-1.2 -1.48,-2.53 -1.91,-3.96h3.82c-0.43,1.43 -1.08,2.76 -1.91,3.96zM14.34,14H9.66c-0.09,-0.66 -0.16,-1.32 -0.16,-2 0,-0.68 0.07,-1.35 0.16,-2h4.68c0.09,0.65 0.16,1.32 0.16,2 0,0.68 -0.07,1.34 -0.16,2zM14.59,19.56c0.6,-1.11 1.06,-2.31 1.38,-3.56h2.95c-0.96,1.65 -2.49,2.93 -4.33,3.56zM16.36,14c0.08,-0.66 0.14,-1.32 0.14,-2 0,-0.68 -0.06,-1.34 -0.14,-2h3.38c0.16,0.64 0.26,1.31 0.26,2s-0.1,1.36 -0.26,2z"/></svg>`;
    const states = [
      {cap:'1 · Idle', sub:'tap-and-hold the mic to talk', prog:'idle', cls:'idleC', glyph:'#7c83fd', stat:'Hold to dictate', sc:'s-idle', chips:[]},
      {cap:'2 · Holding — listening', sub:'mic open, waiting for speech', prog:'idle', cls:'listenC', glyph:'#fff', stat:'Listening…', sc:'s-listen', chips:[]},
      {cap:'3 · Speaking', sub:'speech detected — live preview types', prog:'idle', cls:'speakC', glyph:'#fff', stat:'restart traffic', sc:'s-speak', chips:[]},
      {cap:'4 · Released — transcribing', sub:'decoding the whole take', prog:'busy', cls:'procC', glyph:'#fff', stat:'Transcribing…', sc:'s-proc', chips:['restart','traffic']},
    ];
    document.getElementById('r').innerHTML = states.map(s => `
      <div class="col">
        <div class="cap">${s.cap}<small>${s.sub}</small></div>
        <div class="ime">
          <div class="progress ${s.prog==='busy'?'':'idle'}"><i></i></div>
          <div class="strip"><div class="ib">${KEY}</div><div class="divider"></div><div class="ib">${GLOBE}</div></div>
          <div class="status ${s.sc}">${s.stat}</div>
          <div class="stage"><div class="mic ${s.cls}">${mic(s.glyph)}</div></div>
          <div class="chips">${s.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
          <div class="hint">⌨ flip to keyboard&nbsp;&nbsp;·&nbsp;&nbsp;🌐 switch input method</div>
        </div>
      </div>`).join('');
  </script>
</body></html>
