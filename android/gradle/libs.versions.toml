[versions]
agp = "8.7.3"
kotlin = "2.0.21"
jna = "5.14.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidx-core = "1.13.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
# JNA is the only runtime dependency of the generated UniFFI bindings (no async
# functions, so no coroutines). On Android the `@aar` classifier (added by the app
# module) bundles the per-ABI jnidispatch; on the host JVM the plain jar carries it.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
