[versions]
kotlin = "2.0.21"
jna = "5.14.0"
junit = "4.13.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
# JNA is the only runtime dependency of the generated UniFFI bindings (no async
# functions, so no coroutines). On Android the `@aar` classifier (added by the app
# module) bundles the per-ABI jnidispatch; on the host JVM the plain jar carries it.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
