[package]
name = "idiolect-recording-indicator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "idiolect-recording-indicator"
path = "src/main.rs"

[dependencies]
# `x11` is REQUIRED, not cosmetic: egui-winit only applies
# `ViewportBuilder::with_window_type` (our `_NET_WM_WINDOW_TYPE_NOTIFICATION`, which
# keeps this overlay out of the dock and out of the focus rotation) inside
# `#[cfg(feature = "x11")]`. Without it the type is silently dropped and the HUD
# becomes a normal, focus-stealing, dock-listed window. See `viewport()` in main.rs.
# `wayland` is intentionally omitted: these run as X11/Xwayland clients, so it adds
# the smithay-clipboard/wayland stack for no benefit here.
eframe = { version = "0.36", default-features = false, features = ["glow", "x11"] }

[lints]
workspace = true
