[package]
name = "idiolectd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Run Whisper inference on the GPU (CUDA). Requires the CUDA toolkit at build
# time: `cargo build -p idiolectd --release --features cuda`.
cuda = ["idiolect-adapter-whisper/cuda"]

[dependencies]
idiolect-adapter-clipboard = { path = "../idiolect-adapters/desktop/clipboard" }
idiolect-adapter-cpal = { path = "../idiolect-adapter-cpal" }
idiolect-adapter-crypto = { path = "../idiolect-adapters/crypto" }
idiolect-adapter-ksni = { path = "../idiolect-adapters/desktop/ksni" }
idiolect-adapter-opus = { path = "../idiolect-adapter-opus" }
idiolect-adapter-sqlite = { path = "../idiolect-adapter-sqlite" }
idiolect-adapter-vad = { path = "../idiolect-adapter-vad" }
idiolect-adapter-whisper = { path = "../idiolect-adapter-whisper" }
idiolect-application = { path = "../idiolect-application" }
idiolect-common = { path = "../idiolect-common" }
idiolect-ipc = { path = "../idiolect-ipc" }
idiolect-ports = { path = "../idiolect-ports" }
idiolect-test-support = { path = "../idiolect-test-support" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
