idiolect-adapter-fixture-codec = { path = "../idiolect-adapter-fixture-codec" }
idiolect-common = { path = "../idiolect-common" }
idiolect-ipc = { path = "../idiolect-ipc" }
idiolect-trainerctl = { path = "../idiolect-trainerctl" }
idiolectd = { path = "../idiolectd" }
idiolect-adapter-sqlite = { path = "../idiolect-adapter-sqlite" }
idiolect-ports = { path = "../idiolect-ports" }
