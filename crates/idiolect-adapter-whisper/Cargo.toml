[package]
name = "idiolect-adapter-whisper"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.96"

[lints]
workspace = true

[features]
# Build whisper.cpp with the CUDA backend and run inference on the GPU.
# Requires the CUDA toolkit (nvcc) at build time. Off by default so the CPU
# build (and CI without a GPU) is unaffected.
cuda = ["whisper-rs/cuda"]

[dependencies]
idiolect-ports = { path = "../idiolect-ports" }
thiserror = "=2.0.20"
whisper-rs = "=0.16.0"

[dev-dependencies]
idiolect-test-support = { path = "../idiolect-test-support" }
