[package]
name = "idiolect-sync-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
idiolect-sync = { path = "../idiolect-sync" }
idiolect-adapter-sqlite = { path = "../idiolect-adapter-sqlite" }
idiolect-ports = { path = "../idiolect-ports" }
idiolect-common = { path = "../idiolect-common" }
thiserror.workspace = true
# The personal model server (M5 `GET /model`). Desktop-only — not in the Android `.so`.
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Per-device bearer tokens (S3): random token material for the pairing handshake.
uuid.workspace = true
# Whitens the v4 UUID into a uniform pairing code (the raw UUID version/variant bytes
# are not uniform), and hashes codes/tokens at rest.
sha2.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tempfile.workspace = true
