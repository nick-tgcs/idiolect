version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    # GitFlow: dependency bumps integrate via develop, never straight to main
    # (main only ever merges from develop — enforced by the main-source-guard).
    # NOTE: dependabot reads THIS FILE only from the repo's default branch (main),
    # so this config takes effect once it lands on main.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # One PR per dependency bump — deliberately NOT grouped — so every update,
    # especially a major, is reviewed and lands (or parks) on its own. A bump that
    # fails CI just stays open in the queue for manual attention: nothing is ever
    # ignored or auto-closed. The cap is high so parked failures don't starve new
    # per-bump PRs.
    open-pull-requests-limit: 30
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      # `include: scope` appends the scope, giving e.g. "chore(deps): bump …".
      # The prefix must NOT itself contain "(deps):" or the scope doubles up
      # ("chore(deps):(deps): …"), which is ugly and barely passes the
      # conventional-commits gate.
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # GitFlow: target develop, same as cargo above. Also one PR per action bump
    # (github-actions is never grouped); failures park in the queue, nothing ignored.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker (if we add Docker support later)
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #     time: "09:00"
