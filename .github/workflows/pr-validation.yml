name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    # `edited` is included so retargeting a PR's base branch (e.g. develop -> main
    # with no new commit) re-runs validation; otherwise the main-source-guard below
    # would not be re-evaluated and a green summary could escape the source rule.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.96.0"
  CARGO_TERM_COLOR: always
  # Headless runners have a session bus but no StatusNotifierWatcher; several
  # integration tests run multiple daemons per process, whose pid-keyed ksni
  # tray registrations collide and reset clients. Skip the tray across CI.
  IDIOLECT_DISABLE_TRAY: "1"

jobs:
  # =========================================================================
  # PR SIZE CHECK
  # =========================================================================
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          FILE_COUNT=$(echo "$CHANGED_FILES" | wc -l)
          LINE_COUNT=$(git diff --stat origin/main...HEAD | tail -1 | awk '{print $1}')
          
          echo "Files changed: $FILE_COUNT"
          echo "Lines changed: $LINE_COUNT"
          
          # Warn if PR is too large
          if [ "$FILE_COUNT" -gt 50 ]; then
            echo "::warning::PR modifies more than 50 files ($FILE_COUNT). Consider splitting into smaller PRs."
          fi
          
          if [ "$LINE_COUNT" -gt 1000 ]; then
            echo "::warning::PR modifies more than 1000 lines ($LINE_COUNT). Consider splitting into smaller PRs."
          fi

  # =========================================================================
  # MAIN SOURCE BRANCH GUARD
  #
  # GitHub rulesets can require a PR into main but cannot restrict its *source*
  # branch, so GitFlow's "main only ever merges from develop" is enforced here:
  # a PR whose base is main must come from THIS repo's `develop` branch, else it
  # fails. Folded into "PR Validation Summary" (a required check), so it gates
  # merges to main without adding a new required-check context. PRs into develop
  # are unaffected. The head-repo check matters because `github.head_ref` is only
  # a branch *name*: a fork branch also named `develop` would otherwise pass.
  # =========================================================================
  main-source-guard:
    name: Main Source Branch Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce that main only accepts PRs from this repo's develop
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          echo "PR: ${HEAD_REPO}:${HEAD_REF} -> ${BASE_REF}"
          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "develop" || "$HEAD_REPO" != "$THIS_REPO" ]]; then
              echo "::error::PRs into 'main' must come from '${THIS_REPO}:develop' (got '${HEAD_REPO}:${HEAD_REF}'). Merge your work into develop first, then open a develop -> main PR."
              exit 1
            fi
          fi
          echo "Source-branch policy satisfied."

  # =========================================================================
  # CONVENTIONAL COMMITS CHECK
  # =========================================================================
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the commit check
        run: bash ci/scripts/test-conventional-commits.sh

      - name: Check commit messages
        env:
          # Through the environment, never interpolated into `run:`. A ${{ }}
          # expression is substituted as shell CODE, and git ref names may carry
          # `;`, `$` and backticks; as an environment variable it is data.
          BASE_REF: ${{ github.base_ref }}
        # The PR's OWN base, not main: this repo is GitFlow, so scanning from
        # main made every feature PR inherit develop's commits and fail on
        # subjects it did not write.
        run: bash ci/scripts/check-conventional-commits.sh "origin/$BASE_REF"

  # =========================================================================
  # RUST: Quick validation (fmt, clippy, check, test)
  # =========================================================================
  rust-quick:
    name: Rust Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-pr-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-pr-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libglib2.0-dev \
            libx11-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation (with warnings as errors)
        run: RUSTFLAGS="-D warnings" cargo check --workspace --all-targets --features idiolect-ibus/ibus-engine

      - name: Run clippy (with warnings as errors)
        run: cargo clippy --workspace --all-targets --features idiolect-ibus/ibus-engine -- -D warnings

      - name: Run tests (quick - no doc tests, no coverage)
        run: cargo test --workspace --all-targets --features idiolect-ibus/ibus-engine

      # A full workspace build unifies Cargo features, so a GUI crate missing
      # its eframe windowing backend (x11/wayland) still links one from a
      # sibling and looks fine — while an isolated build of that crate produces
      # a binary that cannot open a window. Build each GUI binary alone to catch
      # that before it reaches a user's desktop.
      - name: Check GUI crates build standalone
        run: bash ci/scripts/test-gui-crates-build-standalone.sh

  # =========================================================================
  # FCITX5: Quick validation
  # =========================================================================
  fcitx5-quick:
    name: FCITX5 Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev libglib2.0-dev

      - name: Configure CMake
        run: |
          cmake -S fcitx5/idiolect-fcitx5 -B fcitx5/idiolect-fcitx5/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build fcitx5/idiolect-fcitx5/build

      - name: Run tests
        run: ctest --test-dir fcitx5/idiolect-fcitx5/build --output-on-failure

  # =========================================================================
  # INTERFACE LEAKAGE CHECK (fast, important for architecture)
  # =========================================================================
  interface-leakage:
    name: Interface No Backend Leakage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-pr-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-pr-

      - name: Run interface leakage check
        run: bash ci/scripts/test-interface-no-backend-leakage.sh

  # =========================================================================
  # REAL ADAPTER DEPENDENCY CHECK (fast, important for architecture)
  # =========================================================================
  real-adapter-deps:
    name: Real Adapter Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-pr-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-pr-

      - name: Run real adapter dependency check
        run: bash ci/scripts/test-real-adapter-deps.sh

  # =========================================================================
  # COVERAGE MAP VALIDATION (ensures docs stay in sync)
  # =========================================================================
  coverage-map:
    name: Coverage Map Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [rust-quick, fcitx5-quick]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-pr-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-pr-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev libglib2.0-dev ripgrep

      - name: Build FCITX5 (for ctest index)
        run: |
          cmake -S fcitx5/idiolect-fcitx5 -B fcitx5/idiolect-fcitx5/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Run coverage map validation
        run: bash ci/scripts/test-coverage-map.sh

  # =========================================================================
  # DESKTOP APP CROSS-PLATFORM CHECK (idiolect-app on macOS)
  #
  # Verifies the idiolect-app dashboard compiles and its tests pass on macOS.
  # Windows build is covered by the full CI matrix; PR validation uses macOS
  # as the representative non-Linux check (faster; no system dep installs).
  # =========================================================================
  desktop-app-cross-platform:
    name: Desktop App Cross-Platform (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-pr-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-pr-

      - name: Clippy idiolect-app (warnings as errors)
        run: |
          cargo clippy \
            -p idiolect-app -p idiolect-sync-server -p idiolect-adapter-sqlite \
            --all-targets -- -D warnings

      - name: Test idiolect-app
        run: |
          cargo test \
            -p idiolect-app -p idiolect-sync-server -p idiolect-adapter-sqlite \
            --all-targets

  # =========================================================================
  # PR VALIDATION SUMMARY
  # =========================================================================
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - pr-size
      - main-source-guard
      - conventional-commits
      - rust-quick
      - fcitx5-quick
      - interface-leakage
      - real-adapter-deps
      - coverage-map
      - desktop-app-cross-platform
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          # Check if any required job failed
          if [[ "${{ needs.pr-size.result }}" != "success" ]] || \
             [[ "${{ needs.main-source-guard.result }}" != "success" ]] || \
             [[ "${{ needs.conventional-commits.result }}" != "success" ]] || \
             [[ "${{ needs.rust-quick.result }}" != "success" ]] || \
             [[ "${{ needs.fcitx5-quick.result }}" != "success" ]] || \
             [[ "${{ needs.interface-leakage.result }}" != "success" ]] || \
             [[ "${{ needs.real-adapter-deps.result }}" != "success" ]] || \
             [[ "${{ needs.coverage-map.result }}" != "success" ]] || \
             [[ "${{ needs.desktop-app-cross-platform.result }}" != "success" ]]; then
            echo "::error::One or more PR validation checks failed"
            exit 1
          fi
          echo "All PR validation checks passed!"