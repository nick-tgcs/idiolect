name: Desktop App Release

# Build and package idiolect-app for all three platforms on every tag that
# matches `desktop-app-v*`. Artifacts are uploaded to the GitHub release.
# Packaging targets: Linux tarball (AppImage builder is a follow-up),
# macOS app bundle (.tar.gz), Windows zip.
#
# Never --all-features or --features cuda — CI only builds the CPU path.

on:
  push:
    tags:
      - 'desktop-app-v*'

env:
  RUST_VERSION: "1.96.0"
  CARGO_TERM_COLOR: always

jobs:
  # =========================================================================
  # BUILD MATRIX (Linux · macOS · Windows)
  # =========================================================================
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: idiolect-app-linux-x86_64.tar.gz
            archive_cmd: tar -czf
            binary: target/release/idiolect-app
            extra_deps: |
              sudo apt-get update
              sudo apt-get install -y libasound2-dev libpulse-dev libglib2.0-dev \
                libx11-dev libxkbcommon-dev
          - os: macos
            runner: macos-latest
            artifact: idiolect-app-macos-arm64.tar.gz
            archive_cmd: tar -czf
            binary: target/release/idiolect-app
            extra_deps: ""
          - os: windows
            runner: windows-latest
            artifact: idiolect-app-windows-x86_64.zip
            binary: target/release/idiolect-app.exe
            extra_deps: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'linux'
        run: ${{ matrix.extra_deps }}

      - name: Build release binaries
        run: |
          cargo build --release -p idiolect-app
          cargo build --release -p idiolect-trainerctl

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist
          cp ${{ matrix.binary }} dist/idiolect-app
          cp target/release/idiolect-trainerctl dist/idiolect-trainerctl 2>/dev/null || true
          cd dist && tar -czf ../${{ matrix.artifact }} .

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item ${{ matrix.binary }} dist\idiolect-app.exe
          if (Test-Path target\release\idiolect-trainerctl.exe) {
            Copy-Item target\release\idiolect-trainerctl.exe dist\idiolect-trainerctl.exe
          }
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # =========================================================================
  # RELEASE
  # =========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
