[workspace]
resolver = "2"
members = [
    "crates/idiolect-common",
    "crates/idiolect-core",
    "crates/idiolect-ports",
    "crates/idiolect-application",
    "crates/idiolect-ipc",
    "crates/idiolect-adapter-memory",
    "crates/idiolect-adapter-sqlite",
    "crates/idiolect-adapter-fixture-audio",
    "crates/idiolect-adapter-fixture-asr",
    "crates/idiolect-adapter-fixture-codec",
    "crates/idiolect-adapter-cpal",
    "crates/idiolect-adapter-opus",
    "crates/idiolect-adapter-translate",
    "crates/idiolect-adapter-vad",
    "crates/idiolect-adapter-whisper",
    "crates/idiolect-trainerctl",
    "crates/idiolect-ml-core",
    "crates/idiolect-trainer-burn",
    "crates/idiolectd",
    "crates/idiolect-cli",
    "crates/idiolect-review-dialog",
    "crates/idiolect-recording-indicator",
    "crates/idiolect-retention-dialog",
    "crates/idiolect-test-support",
    "crates/idiolect-integration-tests",
    "crates/idiolect-adapters/desktop/ksni",
    "crates/idiolect-adapters/desktop/clipboard",
    "crates/idiolect-adapters/desktop/ibus",
    "crates/idiolect-adapters/crypto",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
thiserror = "=2.0.18"
time = { version = "=0.3.36", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.38.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.0", default-features = false, features = ["bundled"] }
sha2 = "=0.11.0"
cpal = "=0.18.1"
opus = "=0.3.1"
webrtc-vad = "=0.4.0"
whisper-rs = "=0.16.0"
toml = "=0.9.5"
burn = { version = "=0.13.2", default-features = false, features = ["std", "ndarray"] }
burn-ndarray = { version = "=0.13.2", default-features = false, features = ["std"] }
bincode = "=3.0.0"
tempfile = "=3.10.1"
