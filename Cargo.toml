[workspace]
resolver = "2"
members = [
    "crates/idiolect-common",
    "crates/idiolect-core",
    "crates/idiolect-ports",
    "crates/idiolect-application",
    "crates/idiolect-ipc",
    "crates/idiolect-adapter-memory",
    "crates/idiolect-adapter-sqlite",
    "crates/idiolect-adapter-fixture-audio",
    "crates/idiolect-adapter-fixture-asr",
    "crates/idiolect-adapter-fixture-codec",
    "crates/idiolect-adapter-cpal",
    "crates/idiolect-adapter-opus",
    "crates/idiolect-adapter-translate",
    "crates/idiolect-adapter-vad",
    "crates/idiolect-adapter-whisper",
    "crates/idiolect-trainerctl",
    "crates/idiolect-sync",
    "crates/idiolect-sync-client",
    "crates/idiolect-sync-server",
    "crates/idiolect-ffi",
    "crates/idiolect-ml-core",
    "crates/idiolect-trainer-burn",
    "crates/idiolectd",
    "crates/idiolect-cli",
    "crates/idiolect-review-dialog",
    "crates/idiolect-settings",
    "crates/idiolect-recording-indicator",
    "crates/idiolect-retention-dialog",
    "crates/idiolect-test-support",
    "crates/idiolect-app",
    "crates/idiolect-integration-tests",
    "crates/idiolect-adapters/desktop/ksni",
    "crates/idiolect-adapters/desktop/clipboard",
    "crates/idiolect-adapters/desktop/ibus",
    "crates/idiolect-adapters/crypto",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
time = { version = "=0.3.54", features = ["serde", "formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
sha2 = "=0.11.0"
cpal = "=0.18.1"
opus = "=0.3.1"
webrtc-vad = "=0.4.0"
whisper-rs = "=0.16.0"
toml = "=1.1.3"
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
burn-ndarray = { version = "=0.21.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
# Desktop-only HTTP (the personal model/sync server). Not a dependency of the
# Android `.so` (idiolect-ffi), so it never reaches the phone.
axum = "=0.8.9"
tower = "=0.5.3"
http-body-util = "=0.1.4"

# The Burn whisper parity/training tests do real model math; without optimized
# kernels they take minutes under `cargo test` (dev profile). Only these math
# dependencies are optimized — workspace code keeps debug ergonomics.
[profile.dev.package.burn-ndarray]
opt-level = 3
[profile.dev.package.burn-tensor]
opt-level = 3
[profile.dev.package.burn-autodiff]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.idiolect-trainer-burn]
opt-level = 3
[profile.dev.package.idiolect-trainerctl]
opt-level = 3
